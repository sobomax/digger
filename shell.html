  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #c0c0c0;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .header {
      padding: 24px 0 12px;
      text-align: center;
    }

    .title {
      font-size: 28px;
      color: #33ff33;
      text-shadow: 0 0 20px #33ff3366, 0 0 40px #33ff3333;
      letter-spacing: 0.3em;
    }

    .subtitle {
      font-size: 9px;
      color: #888;
      margin-top: 8px;
      letter-spacing: 0.15em;
      font-family: monospace;
    }

    .game-wrap {
      position: relative;
      width: min(640px, calc(100vw - 24px));
      aspect-ratio: 640 / 400;
      margin: 12px auto;
      border: 2px solid #222;
      border-radius: 4px;
      box-shadow: 0 0 30px #000, 0 0 2px #33ff3322;
      background: #000;
      line-height: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .controls-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 8px 20px;
      border: 1px solid #33ff33;
      background: transparent;
      color: #33ff33;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #33ff3318;
      box-shadow: 0 0 12px #33ff3333;
    }
    .btn:active {
      background: #33ff3330;
    }

    .instructions {
      max-width: 640px;
      padding: 20px 24px;
      text-align: center;
    }

    .instructions h2 {
      font-size: 11px;
      color: #33ff33;
      margin-bottom: 14px;
    }

    .keys {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      font-family: monospace;
      font-size: 12px;
    }

    .keytable {
      border-collapse: separate;
      border-spacing: 6px 5px;
    }

    .keytable th {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      font-weight: normal;
      color: #33ff33;
      text-align: left;
      padding-bottom: 2px;
    }

    .keytable td.label {
      text-align: right;
      padding-right: 4px;
    }

    .keytable td.label.after {
      text-align: left;
      padding-right: 14px;
    }

    .keys-note {
      margin-top: 12px;
      color: #777;
      font-family: monospace;
      font-size: 11px;
    }

    .key {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 1px 7px;
      font-size: 11px;
      color: #e0e0e0;
      min-width: 24px;
      text-align: center;
    }

    .label {
      color: #777;
      font-size: 11px;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-size: 12px;
      color: #33ff33;
      margin-bottom: 16px;
    }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #33ff33;
      width: 0%;
      transition: width 0.2s;
    }

    .footer {
      padding: 16px 0 24px;
      text-align: center;
      font-family: monospace;
      font-size: 10px;
      color: #444;
    }
    .footer a {
      color: #33ff3388;
      text-decoration: none;
    }
    .footer a:hover {
      color: #33ff33;
    }

    @media (max-width: 700px) {
      .title { font-size: 20px; }
      .header { padding: 16px 0 8px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">D I G G E R</div>
    <div class="subtitle">REMASTERED &mdash; WINDMILL SOFTWARE 1983</div>
  </div>

  <div class="game-wrap" id="game-wrap">
    <div class="loading-overlay" id="loading">
      <div class="loading-text" id="status">Loading...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  </div>

  <div class="controls-bar">
    <button class="btn" id="btn-fullscreen">Alt-Enter FULLSCREEN</button>
  </div>

  <div class="instructions">
    <h2>CONTROLS</h2>
    <!-- Filled in by renderKeymap(): defaults first, then the game's own -->
    <div class="keys" id="keys"></div>
    <div class="keys-note">
      Player 2 keys apply to the two-player modes.
      Press <span class="key" id="key-redefine-note">K</span> on the title screen to redefine keys.
    </div>
  </div>

  <div class="footer">
    <a id="build-link" href="https://github.com/sobomax/digger">github</a>
  </div>

  <script src="digger-build-info.js"></script>
  <script>
    var buildLinkElement = document.getElementById('build-link');
    var statusElement = document.getElementById('status');
    var progressFill = document.getElementById('progress-fill');
    var gameWrapElement = document.getElementById('game-wrap');
    var loadingOverlay = document.getElementById('loading');
    var canvasElement = document.getElementById('canvas');
    var windowedCanvasWidth = 640;
    var windowedCanvasHeight = 400;

    var configureBuildLink = function() {
      var buildInfo;
      var linkText;

      if (typeof window.getDiggerBuildInfo !== 'function') {
        return;
      }
      buildInfo = window.getDiggerBuildInfo();
      if (!buildInfo || !buildInfo.revision) {
        return;
      }
      linkText = 'github @ ' + (buildInfo.shortRevision || buildInfo.revision);
      if (buildInfo.dirty) {
        linkText += ' dirty';
      }
      buildLinkElement.href = buildInfo.revisionUrl || buildLinkElement.href;
      buildLinkElement.textContent = linkText;
    };

    configureBuildLink();

    var restoreWindowedCanvasSize = function() {
      canvasElement.style.removeProperty('width');
      canvasElement.style.removeProperty('height');
      gameWrapElement.style.removeProperty('width');
      gameWrapElement.style.removeProperty('height');
      if (Module.setCanvasSize) {
        Module.setCanvasSize(windowedCanvasWidth, windowedCanvasHeight);
      } else {
        canvasElement.width = windowedCanvasWidth;
        canvasElement.height = windowedCanvasHeight;
      }
    };

    document.addEventListener('fullscreenchange', function() {
      if (!document.fullscreenElement) {
        restoreWindowedCanvasSize();
      }
    });

    /*
     * Nearest-neighbour ("pixelated") scaling only looks right when every
     * game pixel maps onto a whole number of device pixels. With e.g. 125%
     * or 150% display scaling it duplicates some rows/columns but not
     * others, which makes the edges jagged, so smooth the canvas then.
     */
    var updateCanvasSmoothing = function() {
      var dpr = window.devicePixelRatio || 1;
      var sx = canvasElement.clientWidth * dpr / canvasElement.width;
      var sy = canvasElement.clientHeight * dpr / canvasElement.height;
      var whole = function(v) {
        return v >= 1 && Math.abs(v - Math.round(v)) < 0.01;
      };

      canvasElement.style.imageRendering =
        (whole(sx) && whole(sy)) ? 'pixelated' : 'auto';
    };

    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(updateCanvasSmoothing).observe(canvasElement);
    }
    window.addEventListener('resize', updateCanvasSmoothing);
    updateCanvasSmoothing();

    document.getElementById('btn-fullscreen').addEventListener('click', function() {
      Module._digger_request_fullscreen();
      canvasElement.focus();
    });

    /*
     * Keep the CONTROLS panel in sync with the game's key bindings: the game
     * calls window.diggerKeymapChanged() at startup and after the keys have
     * been redefined, and digger_get_keymap() returns them as JSON.
     */
    var keyGlyphs = {Up: '↑', Down: '↓', Left: '←', Right: '→'};

    /* Short labels for SDL's longer key names so the tables stay compact */
    var keyShort = {
      'Numlock': 'NumLk', 'CapsLock': 'Caps', 'ScrollLock': 'ScrLk',
      'PageUp': 'PgUp', 'PageDown': 'PgDn', 'Insert': 'Ins', 'Delete': 'Del',
      'Backspace': 'BkSp', 'Return': 'Enter', 'Escape': 'Esc',
      'PrintScreen': 'PrtSc', 'Application': 'Menu'
    };

    var keyLabel = function(name) {
      if (keyGlyphs[name])
        return keyGlyphs[name];
      if (keyShort[name])
        return keyShort[name];
      return name.replace(/^Keypad /, 'KP ').replace(/^Left /, 'L ')
        .replace(/^Right /, 'R ');
    };

    var defaultKeymap = {
      p1: {up: 'Up', down: 'Down', left: 'Left', right: 'Right', fire: 'F1'},
      p2: {up: 'W', down: 'Z', left: 'A', right: 'S', fire: 'Tab'},
      music: 'F7', sound: 'F9', pause: 'Space', mode: 'N', redefine: 'K',
      exit: 'F10'
    };

    var renderKeymap = function(km) {
      var keysElement = document.getElementById('keys');
      var el = function(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls)
          e.className = cls;
        if (text !== undefined)
          e.textContent = text;
        return e;
      };
      var keyCell = function(name) {
        var td = el('td');
        td.appendChild(el('span', 'key', keyLabel(name)));
        return td;
      };
      var players = el('table', 'keytable');
      var game = el('table', 'keytable');
      var tr, th;

      /* Player keys: one row per action, a column per player */
      tr = el('tr');
      tr.appendChild(el('th'));
      tr.appendChild(el('th', null, 'PLAYER 1'));
      tr.appendChild(el('th', null, 'PLAYER 2'));
      players.appendChild(tr);
      [['up', 'Up'], ['down', 'Down'], ['left', 'Left'], ['right', 'Right'],
       ['fire', 'Fire']].forEach(function(act) {
        tr = el('tr');
        tr.appendChild(el('td', 'label', act[1]));
        tr.appendChild(keyCell(km.p1[act[0]]));
        tr.appendChild(keyCell(km.p2[act[0]]));
        players.appendChild(tr);
      });

      /* Game keys: two key/label pairs per row */
      tr = el('tr');
      th = el('th', null, 'GAME');
      th.colSpan = 4;
      tr.appendChild(th);
      game.appendChild(tr);
      [[[km.music, 'Music On/Off'], [km.mode, 'Game Mode']],
       [[km.sound, 'Sound On/Off'], [km.redefine, 'Redefine Keys']],
       [[km.pause, 'Pause'], [km.exit, 'Exit Game']]].forEach(function(row) {
        tr = el('tr');
        row.forEach(function(pair) {
          tr.appendChild(keyCell(pair[0]));
          tr.appendChild(el('td', 'label after', pair[1]));
        });
        game.appendChild(tr);
      });

      keysElement.textContent = '';
      keysElement.appendChild(players);
      keysElement.appendChild(game);
      document.getElementById('key-redefine-note').textContent =
        keyLabel(km.redefine);
    };

    renderKeymap(defaultKeymap);

    window.diggerKeymapChanged = function() {
      try {
        renderKeymap(JSON.parse(Module.UTF8ToString(Module._digger_get_keymap())));
      } catch (e) {
        console.error('keymap update failed:', e);
      }
    };

    var setStatus = function(text) {
      if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
      if (text === setStatus.last.text) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - setStatus.last.time < 30) return;
      setStatus.last.time = now;
      setStatus.last.text = text;
      if (m) {
        var pct = (parseInt(m[2]) / parseInt(m[4])) * 100;
        progressFill.style.width = pct + '%';
        statusElement.textContent = m[1].trim() || 'Loading...';
      } else {
        if (!text) {
          loadingOverlay.classList.add('hidden');
          updateCanvasSmoothing(); /* the canvas has its real size by now */
          canvasElement.focus();
        } else {
          statusElement.textContent = text;
        }
      }
    };

    var Module = {
      print: function() {
        var text = Array.prototype.slice.call(arguments).join(' ');
        console.log(text);
      },
      canvas: canvasElement,
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left
          ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };

    setStatus('Downloading...');

    window.onerror = function(event) {
      statusElement.textContent = 'Error - see console';
      setStatus = function(text) {
        if (text) console.error('[post-exception] ' + text);
      };
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
