name: Linux Build & Test

# Controls when the action will run. 
on:
  # Triggers the workflow on all push or pull request events
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    env:
      COMPILER: ${{ matrix.compiler }}
      TEST_TYPE: ${{ matrix.test_type }}

    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        compiler: ['gcc', 'clang']
        test_type: ['short', 'long', 'xlong', 'netsim']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: before_install
        run: sudo -H DEBIAN_FRONTEND=noninteractive apt-get update

      - name: Workaround for tar not being able to access /var/cache/apt/archives
        run: sudo chmod u+s "$(command -v tar)"

      # Cache the apt-get packages
      - name: Cache apt-get packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ matrix.os }}-apt-get-${{ hashFiles('**/apt-get-requirement.txt') }}

      # Install the apt-get packages
      - name: Install apt-get packages
        run: |
          cat apt-get-requirement.txt | xargs sudo apt-get -yq --no-install-recommends install

      - name: test
        env:
          CC: ${{ env.COMPILER }}
          CI_COVERAGE: 1
        run: |
          make do-test-cmake

      - name: Coveralls Parallel
        if: matrix.os != 'ubuntu-20.04' || matrix.compiler != 'clang'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: run-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.test_type }}
          parallel: true
          path-to-lcov: ./digger_lcov/digger.info

  ubsan:
    # The tests with a build that stops at any undefined behavior
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['gcc', 'clang']
    env:
      TEST_TYPE: short,netsim

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install apt-get packages
        run: |
          sudo -H DEBIAN_FRONTEND=noninteractive apt-get update
          cat apt-get-requirement.txt | xargs sudo apt-get -yq --no-install-recommends install
          # Clang's UBSan runtime, which isn't there otherwise
          if [ "${{ matrix.compiler }}" = "clang" ]
          then
            sudo apt-get -yq --no-install-recommends install libclang-rt-dev
          fi

      - name: test
        env:
          CC: ${{ matrix.compiler }}
          CI_UBSAN: 1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          make do-test-cmake

  memory_sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC ASan
            cc: gcc
            cxx: g++
            sanitizer: address
            flags: -fsanitize=address -fno-omit-frame-pointer
            ldflags: -fsanitize=address
          - name: Clang ASan
            cc: clang
            cxx: clang++
            sanitizer: address
            flags: -fsanitize=address -fno-omit-frame-pointer
            ldflags: -fsanitize=address
          - name: Clang MSan
            cc: clang
            cxx: clang++
            sanitizer: memory
            flags: -fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -fPIE
            ldflags: -fsanitize=memory -pie
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1
      MSAN_OPTIONS: halt_on_error=1:exit_code=86
      TEST_TYPES: short,netsim

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-recommends install \
            build-essential clang llvm libclang-rt-dev cmake ninja-build curl libsdl2-dev zlib1g-dev

      - name: Build MSan dependencies
        if: matrix.sanitizer == 'memory'
        run: |
          sh scripts/build-msan-deps.sh "${RUNNER_TEMP}/msan" "${RUNNER_TEMP}/msan-build"
          echo "${RUNNER_TEMP}/msan/bin" >> "${GITHUB_PATH}"

      - name: Configure
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          SANITIZER_FLAGS: ${{ matrix.flags }}
          SANITIZER_LDFLAGS: ${{ matrix.ldflags }}
        run: |
          . scripts/cmake_flags.sub
          set --
          if [ "${SANITIZER}" = memory ]; then
            # Select the instrumented archives explicitly; never fall back to
            # the distro's SDL/zlib or link its display libraries.
            set -- -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/msan" \
              -DSDL2_LIBRARY_RELEASE="${RUNNER_TEMP}/msan/lib/libSDL2.a" \
              -DSDL2main_LIBRARIES="${RUNNER_TEMP}/msan/lib/libSDL2main.a" \
              -DSDL2_INCLUDE_DIR="${RUNNER_TEMP}/msan/include/SDL2" \
              -DZLIB_LIBRARY="${RUNNER_TEMP}/msan/lib/libz.a" \
              -DZLIB_INCLUDE_DIR="${RUNNER_TEMP}/msan/include" \
              -DCMAKE_DISABLE_FIND_PACKAGE_X11=TRUE
          fi
          cmake -S . -B build-sanitizer -G Ninja \
            ${CMAKE_FLAGS_relwithdebinfo} ${CMAKE_FLAGS_TEST} \
            -DCMAKE_C_FLAGS="${SANITIZER_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${SANITIZER_LDFLAGS}" "$@"

      - name: Build
        run: cmake --build build-sanitizer --parallel 2

      - name: Test
        env:
          DIGGER_BIN: ./build-sanitizer/digger
        run: sh scripts/do-test-run.sh

  submit_coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
        path-to-lcov: ./digger_lcov/digger.info

  # The base images built on, and the platforms of each: built for all of
  # them at once, each tested on a runner of its own (see test_in_docker)
  docker_platforms:
    needs: [build, ubsan, memory_sanitizers]
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.list.outputs.bases }}
      platforms: ${{ steps.list.outputs.platforms }}
      tests: ${{ steps.list.outputs.tests }}
    steps:
    - name: List the platforms
      id: list
      run: |
        set -eu
        bases='[]'
        platforms='{}'
        tests='[]'
        for base in debian:sid-slim debian:13-slim debian:12-slim ubuntu:latest
        do
          # mips64 seems to be broken at the moment...
          if [ "${base}" = "debian:sid-slim" ]
          then
            FILT="grep -v mips64le"
          else
            FILT="cat"
          fi
          PLATFORMS="`docker manifest inspect ${base} | \
           jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant != null then "/\(.platform.variant)" else "" end)"' | \
           sort -u | grep -v unknown | ${FILT}`"
          os_tag="`echo ${base} | sed 's|:|_|g'`"
          bases="`echo "${bases}" | jq -c --arg b "${base}" '. + [$b]'`"
          platforms="`echo "${platforms}" | jq -c --arg b "${base}" \
           --arg p "\`echo "${PLATFORMS}" | paste -sd ','\`" '. + {($b): $p}'`"
          for platform in ${PLATFORMS}
          do
            tests="`echo "${tests}" | jq -c --arg b "${base}" --arg t "${os_tag}" \
             --arg p "${platform}" --arg pt "\`echo ${platform} | sed 's|/|_|g'\`" \
             --arg a "${platform#linux/}" \
             '. + [{base_image: $b, os_tag: $t, platform: $p, platform_tag: $pt, arch: $a}]'`"
          done
        done
        echo "bases=${bases}" >> $GITHUB_OUTPUT
        echo "platforms=${platforms}" >> $GITHUB_OUTPUT
        echo "tests=${tests}" >> $GITHUB_OUTPUT

  build_in_docker:
    needs: [docker_platforms]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        base_image: ${{ fromJSON(needs.docker_platforms.outputs.bases) }}
    env:
      BASE_IMAGE: ${{ matrix.base_image }}
      DOCKER_RW: ${{ (github.repository == format('{0}/digger', github.repository_owner) && github.event_name != 'pull_request') && 'true' || 'false' }}
      GHCR_REPO: ghcr.io/${{ github.repository_owner }}/digger
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v4

    - name: Login to GitHub Container Registry
      if: ${{ env.DOCKER_RW == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Set environments
      run: |
        echo "PLATFORMS=${{ fromJSON(needs.docker_platforms.outputs.platforms)[matrix.base_image] }}" >> $GITHUB_ENV
        GIT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
        GIT_BRANCH="${GIT_BRANCH#refs/tags/}"
        echo "GIT_BRANCH=${GIT_BRANCH}" >> $GITHUB_ENV
        OS_TAG="`echo ${BASE_IMAGE} | sed 's|:|_|g'`"
        echo "OS_TAG=${OS_TAG}" >> $GITHUB_ENV
        if [ "${DOCKER_RW}" = 'true' ]; \
        then \
          CACHE_SPEC="type=registry,ref=${{ env.GHCR_REPO }}:${GIT_BRANCH}-${OS_TAG}-buildcache"; \
        else \
          CACHE_SPEC="type=gha"; \
        fi
        echo "CACHE_SPEC=${CACHE_SPEC}" >> $GITHUB_ENV
        # The ccache of the branch's last good build (master's for a PR) to
        # start from, if there is one, see Export ccache
        BRANCH_TAG="`echo ${GIT_BRANCH} | sed 's|/|_|g'`"
        if [ "${DOCKER_RW}" = 'true' ]
        then
          CCACHE_IMAGE="${{ env.GHCR_REPO }}:${BRANCH_TAG}-${OS_TAG}-ccache"
        else
          CCACHE_IMAGE="${{ env.GHCR_REPO }}:master-${OS_TAG}-ccache"
        fi
        if docker manifest inspect "${CCACHE_IMAGE}" > /dev/null 2>&1
        then
          CCACHE_BIMAGE="${CCACHE_IMAGE}"
        else
          CCACHE_BIMAGE="scratch"
        fi
        echo "CCACHE_IMAGE=${CCACHE_IMAGE}" >> $GITHUB_ENV
        echo "CCACHE_BIMAGE=${CCACHE_BIMAGE}" >> $GITHUB_ENV

    # All the platforms built before any of them is tested: the tests of
    # one going on while others still build were starved of CPU
    - name: Build Docker image
      id: build_docker_image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/Dockerfile.build
        target: build
        build-args: |
          BASE_IMAGE=${{ env.BASE_IMAGE }}
          CCACHE_IMAGE=${{ env.CCACHE_BIMAGE }}
        platforms: ${{ env.PLATFORMS }}
        push: false
        cache-from: ${{ env.CACHE_SPEC }}
        cache-to: ${{ env.CACHE_SPEC }},mode=max

    # What the platforms are tested with (see test_in_docker), from the same
    # builder, whose cache has them built already: all of them in an OCI
    # archive, for each test job to take its own platform's from
    - name: Export test image
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        file: ./docker/Dockerfile.build
        target: test_image
        build-args: |
          BASE_IMAGE=${{ env.BASE_IMAGE }}
          CCACHE_IMAGE=${{ env.CCACHE_BIMAGE }}
        platforms: ${{ env.PLATFORMS }}
        tags: digger-test:${{ env.OS_TAG }}
        outputs: type=oci,dest=/tmp/digger-test-image.tar
        cache-from: ${{ env.CACHE_SPEC }}

    # By the run alone (not its attempt), for the tests re-run alone to
    # find it too
    - name: Save test image
      uses: actions/cache/save@v6
      with:
        path: /tmp/digger-test-image.tar
        key: digger-test-image-${{ env.OS_TAG }}-${{ github.run_id }}
      continue-on-error: true

    # Save ccache after a successful build, even if its tests fail
    - name: Export ccache
      if: ${{ always() && steps.build_docker_image.outcome == 'success' && env.DOCKER_RW == 'true' }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/Dockerfile.build
        target: ccache_export
        build-args: |
          BASE_IMAGE=${{ env.BASE_IMAGE }}
          CCACHE_IMAGE=${{ env.CCACHE_BIMAGE }}
        platforms: ${{ env.PLATFORMS }}
        tags: ${{ env.CCACHE_IMAGE }}
        push: true
        cache-from: ${{ env.CACHE_SPEC }}

  # Each platform tested on a runner of its own, in a container of the image
  # built for it (see build_in_docker): all of them tested at once in the
  # build, mostly emulated, they went short of CPU
  test_in_docker:
    name: Test ${{ matrix.arch }} on ${{ matrix.base_image }}
    needs: [docker_platforms, build_in_docker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.docker_platforms.outputs.tests) }}
    env:
      TEST_IMAGE: digger-test:${{ matrix.os_tag }}
    steps:
    - name: Set up QEMU
      if: ${{ matrix.platform != 'linux/amd64' && matrix.platform != 'linux/386' }}
      uses: docker/setup-qemu-action@v4

    - name: Restore test image
      uses: actions/cache/restore@v6
      with:
        path: /tmp/digger-test-image.tar
        key: digger-test-image-${{ matrix.os_tag }}-${{ github.run_id }}
        fail-on-cache-miss: true

    - name: Load ${{ matrix.arch }} test image
      env:
        TARGETPLATFORM: ${{ matrix.platform }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends skopeo
        target_os="${TARGETPLATFORM%%/*}"
        target_arch_variant="${TARGETPLATFORM#*/}"
        target_arch="${target_arch_variant%%/*}"
        copy_args="--override-os ${target_os} --override-arch ${target_arch}"
        if [ "${target_arch_variant}" != "${target_arch}" ]
        then
          copy_args="${copy_args} --override-variant ${target_arch_variant#*/}"
        fi
        skopeo copy ${copy_args} oci-archive:/tmp/digger-test-image.tar \
          docker-daemon:${TEST_IMAGE}

    # The runs of the NetSim tests that fail kept (NETSIM_KEEP), for their
    # logs; an emulated platform's CPU QEMU's most capable (QEMU_CPU), on
    # those its emulator has the max model for (not ppc64le's or mips's)
    - name: Run tests
      timeout-minutes: 60
      run: |
        CTR="digger-test-${{ github.run_id }}-${{ strategy.job-index }}"
        trap 'docker rm -f "${CTR}" > /dev/null 2>&1 || true' EXIT
        case "${{ matrix.platform }}" in
        linux/arm/*|linux/arm64*|linux/riscv64|linux/s390x)
          QEMU_CPU_ENV="-e QEMU_CPU=max"
          ;;
        *)
          QEMU_CPU_ENV=""
          ;;
        esac
        docker create --platform "${{ matrix.platform }}" --name "${CTR}" \
          -e TARGETPLATFORM="${{ matrix.platform }}" ${QEMU_CPU_ENV} \
          -e NETSIM_KEEP=/tmp/netsim-keep "${TEST_IMAGE}"
        TEST_RES="ok"
        docker start -a "${CTR}" || TEST_RES="fail"
        docker cp "${CTR}:/tmp/netsim-keep" ./netsim-keep > /dev/null 2>&1 || true
        test "${TEST_RES}" = "ok"

    - name: Upload NetSim logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: netsim-logs_${{ matrix.os_tag }}_${{ matrix.platform_tag }}
        path: netsim-keep
        if-no-files-found: ignore
