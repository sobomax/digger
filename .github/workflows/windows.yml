name: Windows Build

# Controls when the action will run.
on:
  # Triggers the workflow on all push or pull request events
  push:
    branches:
      - '**'
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:
    outputs:
      package_artifacts:
        description: Package artifact names uploaded by this workflow.
        value: ${{ jobs.build.outputs.package_artifacts }}

  schedule:
    - cron: "0 0 * * *"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # Run on a Windows host so the produced binaries are native Windows PE files
    runs-on: windows-latest
    outputs:
      package_artifacts: ${{ steps.package_artifacts.outputs.names }}

    permissions:
      contents: read

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up MSYS2 with MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            zip
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Load dependency versions
        run: |
          . scripts/dep-versions.sub
          echo "SDL_VER=${SDL_VER:-${SDL_VER_DEFAULT}}" >> "$GITHUB_ENV"
          echo "ZLIB_VER=${ZLIB_VER:-${ZLIB_VER_DEFAULT}}" >> "$GITHUB_ENV"

      - name: Cache Windows deps
        uses: actions/cache@v6
        with:
          path: |
            deps/SDL2-${{ env.SDL_VER }}
            deps/zlib-${{ env.ZLIB_VER }}
          key: windows-deps-${{ env.SDL_VER }}-${{ env.ZLIB_VER }}-${{ hashFiles('scripts/do-build-windows.sh', 'scripts/dep-versions.sub') }}

      - name: Build
        run: |
          DIGGER_INSTRUMENTATION=ON DIGGER_WARNINGS_AS_ERRORS=ON \
          SDL_VER=${{ env.SDL_VER }} ZLIB_VER=${{ env.ZLIB_VER }} \
            sh -x ./scripts/do-build-windows.sh

      - name: Upload distribution ZIP
        uses: actions/upload-artifact@v7
        with:
          name: digger-win64
          path: digger-win64.zip

      - name: Create installer
        run: |
          # Create empty writable runtime files so the installer can bundle
          # them and set the correct filesystem permissions on installation.
          touch digger.sco digger.ini digger.log
          APPVEYOR_BUILD_VERSION="${{ github.run_number }}" \
            "/c/Program Files (x86)/Inno Setup 6/iscc.exe" \
            pkg/windows/digger.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: digger-win64-installer
          path: pkg/windows/DiggerRemastered-Setup.exe

      - name: Test
        # After the packaging: the game writes its .ini, .sco and .log next
        # to the executable
        env:
          # Arguments like /E:file aren't paths to convert for MSYS2
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          TEST_TYPES='quick netsim' DIGGER_BIN=./digger.exe sh ./scripts/do-test-run.sh

      - name: Set package artifact output
        id: package_artifacts
        run: |
          {
            echo 'names<<EOF'
            echo 'digger-win64'
            echo 'digger-win64-installer'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
